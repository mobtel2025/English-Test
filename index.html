<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Poziomu Angielskiego - Mobtel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <div class="max-w-3xl mx-auto pt-10 px-4">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">Test Poziomu Języka Angielskiego</h1>
            <p class="text-gray-500">Certyfikowany przez firmę <strong>Mobtel</strong></p>
        </header>

        <main class="bg-white rounded-lg shadow-lg p-8">
            <!-- Start Screen -->
            <div id="start-screen" class="text-center">
                <p class="text-lg mb-6">Rozwiąż test, aby sprawdzić swój poziom języka angielskiego i zdobądź oficjalny certyfikat firmy Mobtel.</p>
                <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">Rozpocznij Test</button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden">
                <div class="mb-4 flex justify-between text-sm text-gray-500">
                    <span id="question-counter">Pytanie 1 z 10</span>
                </div>
                <h2 id="question-text" class="text-2xl font-semibold mb-6">Question goes here?</h2>
                <div id="answers-container" class="space-y-3">
                    <!-- Answers injected via JS -->
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden text-center">
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Twój Wynik</h2>
                <p class="text-xl mb-2">Udało Ci się zdobyć: <span id="score-text" class="font-bold text-blue-600"></span>/10 punktów</p>
                <p class="text-2xl mb-6">Twój poziom języka angielskiego to: <strong id="level-text" class="text-green-500 text-3xl block mt-2"></strong></p>
                
                <div class="mb-8">
                    <label for="user-name" class="block text-sm font-medium text-gray-700 mb-2">Wpisz swoje imię i nazwisko na certyfikat:</label>
                    <input type="text" id="user-name" class="border border-gray-300 rounded-md px-4 py-2 w-full max-w-sm mx-auto focus:ring-blue-500 focus:border-blue-500" placeholder="Jan Kowalski">
                </div>

                <button id="download-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center mx-auto">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Pobierz Certyfikat Mobtel
                </button>
                
                <canvas id="cert-canvas" width="800" height="600" class="hidden"></canvas>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            { q: "I ___ from Poland.", a: ["am", "is", "are", "be"], correct: 0 },
            { q: "She ___ to the gym every day.", a: ["go", "goes", "going", "gone"], correct: 1 },
            { q: "Yesterday, I ___ a great movie.", a: ["see", "saw", "seen", "seeing"], correct: 1 },
            { q: "If I ___ you, I would study harder.", a: ["am", "was", "were", "been"], correct: 2 },
            { q: "I have been living here ___ 5 years.", a: ["since", "for", "from", "by"], correct: 1 },
            { q: "By this time next year, I ___ my degree.", a: ["will finish", "will have finished", "finished", "finish"], correct: 1 },
            { q: "Despite ___ tired, he kept working.", a: ["be", "being", "to be", "of being"], correct: 1 },
            { q: "Scarcely ___ the room when the phone rang.", a: ["had I entered", "I had entered", "entered I", "I entered"], correct: 0 },
            { q: "It's high time you ___ looking for a job.", a: ["start", "started", "starting", "to start"], correct: 1 },
            { q: "The company's profits have been ___ this quarter.", a: ["soaring", "plummeting", "fluctuating", "all of the above"], correct: 3 }
        ];

        let currentQuestion = 0;
        let score = 0;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const questionCounter = document.getElementById('question-counter');
        const scoreText = document.getElementById('score-text');
        const levelText = document.getElementById('level-text');
        const downloadBtn = document.getElementById('download-btn');
        const userNameInput = document.getElementById('user-name');
        const canvas = document.getElementById('cert-canvas');
        const ctx = canvas.getContext('2d');

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        });

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionCounter.textContent = `Pytanie ${currentQuestion + 1} z ${questions.length}`;
            questionText.textContent = q.q;
            answersContainer.innerHTML = '';
            
            q.a.forEach((ans, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-gray-50 hover:bg-blue-100 border border-gray-200 rounded-lg py-3 px-5 transition duration-200";
                btn.textContent = ans;
                btn.onclick = () => selectAnswer(index);
                answersContainer.appendChild(btn);
            });
        }

        function selectAnswer(index) {
            if (index === questions[currentQuestion].correct) {
                score++;
            }
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function getLevel(s) {
            if (s <= 2) return "A1 (Początkujący)";
            if (s <= 4) return "A2 (Podstawowy)";
            if (s <= 6) return "B1 (Średniozaawansowany)";
            if (s <= 8) return "B2 (Ponad średniozaawansowany)";
            if (s === 9) return "C1 (Zaawansowany)";
            return "C2 (Biegły)";
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            scoreText.textContent = score;
            levelText.textContent = getLevel(score);
        }

        downloadBtn.addEventListener('click', () => {
            const name = userNameInput.value.trim() || "Uczestnik Testu";
            const level = getLevel(score);
            const date = new Date().toLocaleDateString('pl-PL');
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#1d4ed8";
            ctx.lineWidth = 15;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            
            ctx.strokeStyle = "#93c5fd";
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

            ctx.textAlign = "center";
            
            ctx.fillStyle = "#1e3a8a";
            ctx.font = "bold 40px Arial";
            ctx.fillText("CERTYFIKAT JĘZYKOWY", canvas.width / 2, 100);
            
            ctx.fillStyle = "#3b82f6";
            ctx.font = "bold 24px Arial";
            ctx.fillText("Gwarantowany przez firmę MOBTEL", canvas.width / 2, 140);
            
            ctx.fillStyle = "#374151";
            ctx.font = "20px Arial";
            ctx.fillText("Zaświadcza się, że", canvas.width / 2, 220);
            
            ctx.fillStyle = "#111827";
            ctx.font = "italic bold 36px Times New Roman";
            ctx.fillText(name, canvas.width / 2, 280);
            
            ctx.fillStyle = "#374151";
            ctx.font = "20px Arial";
            ctx.fillText("ukończył(a) test kompetencji języka angielskiego z wynikiem:", canvas.width / 2, 340);
            
            ctx.fillStyle = "#10b981";
            ctx.font = "bold 32px Arial";
            ctx.fillText(level, canvas.width / 2, 400);
            
            ctx.fillStyle = "#6b7280";
            ctx.font = "16px Arial";
            ctx.fillText(`Data: ${date}`, 200, 500);
            ctx.fillText("Podpis: Mobtel Education", 600, 500);
            
            const link = document.createElement('a');
            link.download = `Certyfikat_Mobtel_${name.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
